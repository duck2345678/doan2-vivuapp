services:
  vivu-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vivu-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vivudb
      SPRING_DATASOURCE_USERNAME: vivu
      SPRING_DATASOURCE_PASSWORD: vivu
      SPRING_REDIS_HOST: redis
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
      AI_SERVICE_URL: http://vivu-ai-service:8001
    networks:
      - vivu-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vivu-postgres
    environment:
      POSTGRES_DB: vivudb
      POSTGRES_USER: vivu
      POSTGRES_PASSWORD: vivu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivu-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vivu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivu-network
    restart: unless-stopped

  vivu-ai-service:
    build:
      context: ./vivu-ai-service
      dockerfile: Dockerfile
    container_name: vivu-ai-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivu-network
    restart: unless-stopped

networks:
  vivu-network:
    driver: bridge

volumes:
  postgres-data:
