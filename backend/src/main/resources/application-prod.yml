
spring:
  application:
    name: vivu-backend

  # Lazy initialization để giảm memory khi startup
  main:
    lazy-initialization: true

  # Database (Production - Supabase PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5   # Giảm từ 10 xuống 5 để tiết kiệm memory
      minimum-idle: 1        # Giảm từ 2 xuống 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway (Database Migration) - TẮT để dùng Hibernate auto update
  flyway:
    enabled: false

  # JPA/Hibernate (Production settings)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # OAuth2 (Google Login)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_CLIENT_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # Redis (Production - Railway)
  data:
    redis:
      host: ${REDISHOST:${SPRING_REDIS_HOST:localhost}}
      port: ${REDISPORT:${SPRING_REDIS_PORT:6379}}
      password: ${REDISPASSWORD:${SPRING_REDIS_PASSWORD:}}
      username: ${REDISUSER:default}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 4    # Giảm từ 8 xuống 4
          max-idle: 2      # Giảm từ 8 xuống 2
          min-idle: 1      # Giảm từ 2 xuống 1
          max-wait: 2000ms

  # Mail (SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Upload file limits
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Cache - Giảm size cho low memory
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

# JWT & Security Configuration
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000      # 1 day
      refresh-token:
        expiration: 604800000   # 7 days
  oauth2:
    post-login-redirect: ${OAUTH2_REDIRECT_URL:https://yourdomain.com/oauth2-redirect}

# Cloudinary (Media Upload)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Internal Python AI Planning Service
ai:
  python:
    plan-url: ${AI_PYTHON_PLAN_URL}
    internal-service-key: ${AI_PYTHON_INTERNAL_SERVICE_KEY}
    connect-timeout-ms: ${AI_PYTHON_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_PYTHON_READ_TIMEOUT_MS:35000}

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Compression để giảm bandwidth
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Tắt Swagger UI trong production để tiết kiệm memory
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Google Maps Platform API Configuration
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:${GOOGLE_MAPS_API_KEY}}
  routes:
    api-key: ${GOOGLE_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY}}

# Gemini AI Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# Logging - Production optimized (INFO level để tiết kiệm memory)
logging:
  level:
    root: WARN
    com.example.vivuapp: INFO
    org.flywaydb: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
