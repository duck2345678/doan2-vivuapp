<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Test - VNU Guide App</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: #00d9ff;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
      color: #00d9ff;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #333;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #00d9ff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-connect {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: white;
    }

    .btn-disconnect {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
    }

    .btn-subscribe {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
    }

    .btn-send {
      background: linear-gradient(135deg, #0984e3, #74b9ff);
      color: white;
    }

    .btn-clear {
      background: linear-gradient(135deg, #636e72, #b2bec3);
      color: white;
    }

    #status {
      padding: 10px 20px;
      border-radius: 20px;
      display: inline-block;
      margin: 15px 0;
      font-weight: 600;
    }

    .status-disconnected {
      background: #e74c3c;
    }

    .status-connecting {
      background: #f39c12;
    }

    .status-connected {
      background: #00b894;
    }

    #log {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      height: 350px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .log-success {
      color: #3fb950;
    }

    .log-error {
      color: #f85149;
    }

    .log-info {
      color: #58a6ff;
    }

    .log-warning {
      color: #d29922;
    }

    .log-message {
      color: #a5d6ff;
      background: rgba(56, 139, 253, 0.1);
      padding: 5px 10px;
      border-radius: 5px;
      margin: 5px 0;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 18px;
      color: #00d9ff;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 217, 255, 0.3);
    }

    .subscriptions {
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      min-height: 50px;
    }

    .sub-item {
      display: inline-flex;
      align-items: center;
      background: #6c5ce7;
      padding: 5px 12px;
      border-radius: 15px;
      margin: 3px;
      font-size: 12px;
    }

    .sub-item button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 0 0 0 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>🔌 WebSocket STOMP Test - VNU Guide App</h1>

  <!-- Connection Section -->
  <div class="container">
    <div class="section-title">📡 Kết nối</div>

    <label>🔑 JWT Token:</label>
    <input type="text" id="token" placeholder="Paste JWT token từ API login vào đây...">

    <label>🌐 WebSocket URL:</label>
    <input type="text" id="wsUrl" value="http://localhost:8080/ws">

    <div class="btn-group">
      <button class="btn-connect" onclick="connect()">▶ Connect</button>
      <button class="btn-disconnect" onclick="disconnect()">⏹ Disconnect</button>
    </div>

    <div id="status" class="status-disconnected">🔴 Disconnected</div>
  </div>

  <div class="two-col">
    <!-- Subscribe Section -->
    <div class="container">
      <div class="section-title">📌 Subscribe Topics</div>

      <label>Conversation ID:</label>
      <input type="text" id="conversationId" placeholder="e.g., abc-123-xyz">

      <div class="btn-group">
        <button class="btn-subscribe" onclick="subscribeMessages()">📩 Subscribe Messages</button>
        <button class="btn-subscribe" onclick="subscribeTyping()">⌨ Subscribe Typing</button>
      </div>

      <label>Custom Topic:</label>
      <input type="text" id="customTopic" placeholder="e.g., /topic/notifications">
      <div class="btn-group">
        <button class="btn-subscribe" onclick="subscribeCustom()">➕ Subscribe Custom</button>
      </div>

      <label>Active Subscriptions:</label>
      <div id="subscriptions" class="subscriptions">
        <span style="color: #666;">No active subscriptions</span>
      </div>
    </div>

    <!-- Send Message Section -->
    <div class="container">
      <div class="section-title">📤 Gửi Message</div>

      <label>Destination:</label>
      <input type="text" id="destination" placeholder="e.g., /app/typing/{conversationId}">

      <label>Message Body (JSON):</label>
      <textarea id="messageBody" rows="4" placeholder='{"typing": true}'></textarea>

      <div class="btn-group">
        <button class="btn-send" onclick="sendMessage()">📤 Send Message</button>
        <button class="btn-send" onclick="sendTypingEvent()">⌨ Send Typing Event</button>
      </div>
    </div>
  </div>

  <!-- Log Section -->
  <div class="container">
    <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
      📋 Console Log
      <button class="btn-clear" onclick="clearLog()">🗑 Clear</button>
    </div>
    <div id="log"></div>
  </div>

  <script>
    let stompClient = null;
    let subscriptionMap = {};
    let subscriptionCounter = 0;

    function updateStatus(status, text) {
      const el = document.getElementById('status');
      el.className = 'status-' + status;
      el.textContent = text;
    }

    function connect() {
      const token = document.getElementById('token').value.trim();
      const wsUrl = document.getElementById('wsUrl').value.trim();

      if (!token) {
        log('❌ Vui lòng nhập JWT token!', 'error');
        return;
      }

      updateStatus('connecting', '🟡 Connecting...');
      log('🔄 Đang kết nối tới ' + wsUrl + ' ...', 'info');

      try {
        const socket = new SockJS(wsUrl);
        stompClient = Stomp.over(socket);

        // Disable debug logs in console (optional)
        // stompClient.debug = null;

        stompClient.connect(
          { 'Authorization': 'Bearer ' + token },
          function (frame) {
            updateStatus('connected', '🟢 Connected');
            log('✅ Kết nối thành công!', 'success');
            log('📋 Frame: ' + frame, 'info');
          },
          function (error) {
            updateStatus('disconnected', '🔴 Disconnected');
            log('❌ Lỗi kết nối: ' + error, 'error');
          }
        );
      } catch (e) {
        updateStatus('disconnected', '🔴 Disconnected');
        log('❌ Exception: ' + e.message, 'error');
      }
    }

    function disconnect() {
      if (stompClient !== null) {
        stompClient.disconnect(function () {
          updateStatus('disconnected', '🔴 Disconnected');
          log('🔌 Đã ngắt kết nối', 'info');
          subscriptionMap = {};
          updateSubscriptionUI();
        });
      }
    }

    function subscribeMessages() {
      const conversationId = document.getElementById('conversationId').value.trim();
      if (!conversationId) {
        log('❌ Vui lòng nhập Conversation ID!', 'error');
        return;
      }
      subscribeTopic('/topic/message.' + conversationId);
    }

    function subscribeTyping() {
      const conversationId = document.getElementById('conversationId').value.trim();
      if (!conversationId) {
        log('❌ Vui lòng nhập Conversation ID!', 'error');
        return;
      }
      subscribeTopic('/topic/typing.' + conversationId);
    }

    function subscribeCustom() {
      const topic = document.getElementById('customTopic').value.trim();
      if (!topic) {
        log('❌ Vui lòng nhập topic!', 'error');
        return;
      }
      subscribeTopic(topic);
    }

    function subscribeTopic(topic) {
      if (!stompClient || !stompClient.connected) {
        log('❌ Chưa kết nối WebSocket!', 'error');
        return;
      }

      if (subscriptionMap[topic]) {
        log('⚠ Đã subscribe topic này rồi: ' + topic, 'warning');
        return;
      }

      const subscription = stompClient.subscribe(topic, function (message) {
        log('📩 [' + topic + '] ' + message.body, 'message');
      });

      subscriptionMap[topic] = subscription;
      log('✅ Subscribed: ' + topic, 'success');
      updateSubscriptionUI();
    }

    function unsubscribe(topic) {
      if (subscriptionMap[topic]) {
        subscriptionMap[topic].unsubscribe();
        delete subscriptionMap[topic];
        log('🗑 Unsubscribed: ' + topic, 'info');
        updateSubscriptionUI();
      }
    }

    function updateSubscriptionUI() {
      const container = document.getElementById('subscriptions');
      const topics = Object.keys(subscriptionMap);

      if (topics.length === 0) {
        container.innerHTML = '<span style="color: #666;">No active subscriptions</span>';
      } else {
        container.innerHTML = topics.map(topic =>
          `<div class="sub-item">
                        ${topic}
                        <button onclick="unsubscribe('${topic}')" title="Unsubscribe">✕</button>
                    </div>`
        ).join('');
      }
    }

    function sendMessage() {
      if (!stompClient || !stompClient.connected) {
        log('❌ Chưa kết nối WebSocket!', 'error');
        return;
      }

      const destination = document.getElementById('destination').value.trim();
      const body = document.getElementById('messageBody').value.trim();

      if (!destination) {
        log('❌ Vui lòng nhập destination!', 'error');
        return;
      }

      try {
        stompClient.send(destination, {}, body || '{}');
        log('📤 Sent to ' + destination + ': ' + (body || '{}'), 'success');
      } catch (e) {
        log('❌ Send error: ' + e.message, 'error');
      }
    }

    function sendTypingEvent() {
      const conversationId = document.getElementById('conversationId').value.trim();
      if (!conversationId) {
        log('❌ Vui lòng nhập Conversation ID!', 'error');
        return;
      }

      if (!stompClient || !stompClient.connected) {
        log('❌ Chưa kết nối WebSocket!', 'error');
        return;
      }

      const destination = '/app/typing/' + conversationId;
      const body = JSON.stringify({ isTyping: true });

      stompClient.send(destination, {}, body);
      log('⌨ Sent typing event to ' + destination, 'success');
    }

    function log(message, type = '') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString('vi-VN');
      const className = type ? 'log-' + type : '';
      logDiv.innerHTML += `<div class="${className}">[${time}] ${escapeHtml(message)}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    // Initialize
    log('🚀 WebSocket Test Tool ready!', 'info');
    log('📝 Bước 1: Paste JWT token từ API login', 'info');
    log('📝 Bước 2: Click Connect để kết nối', 'info');
    log('📝 Bước 3: Subscribe vào topic và gửi message', 'info');
  </script>
</body>

</html>
