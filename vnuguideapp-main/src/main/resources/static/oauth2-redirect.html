<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Login Success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .success-icon {
            text-align: center;
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .token-section {
            margin-bottom: 25px;
        }

        .token-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .token-container {
            position: relative;
        }

        .token-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .copy-btn:active {
            background: #4556b8;
        }

        .copy-btn.copied {
            background: #4CAF50;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box p {
            margin: 8px 0;
            color: #1976D2;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            color: #c62828;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Đăng nhập thành công!</h1>
        <p class="subtitle">Google OAuth2 authentication successful</p>

        <div id="content"></div>

        <div class="actions">
            <a href="/swagger-ui/index.html" class="btn btn-primary">Swagger UI</a>
            <button onclick="clearTokens()" class="btn btn-secondary">Xóa Tokens</button>
        </div>
    </div>

    <script>
        // Lấy tokens từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token');

        function displayTokens() {
            const content = document.getElementById('content');

            if (!accessToken && !refreshToken) {
                content.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Không tìm thấy tokens!</strong>
                        <p>URL không chứa access_token hoặc refresh_token.</p>
                        <p>Vui lòng thử đăng nhập lại.</p>
                    </div>
                `;
                return;
            }

            // Lưu vào localStorage
            if (accessToken) {
                localStorage.setItem('access_token', accessToken);
            }
            if (refreshToken) {
                localStorage.setItem('refresh_token', refreshToken);
            }

            // Hiển thị tokens
            content.innerHTML = `
                ${accessToken ? `
                <div class="token-section">
                    <label class="token-label">🔑 Access Token:</label>
                    <div class="token-container">
                        <div class="token-box" id="accessToken">${accessToken}</div>
                        <button class="copy-btn" onclick="copyToClipboard('accessToken', this)">Copy</button>
                    </div>
                </div>
                ` : ''}

                ${refreshToken ? `
                <div class="token-section">
                    <label class="token-label">🔄 Refresh Token:</label>
                    <div class="token-container">
                        <div class="token-box" id="refreshToken">${refreshToken}</div>
                        <button class="copy-btn" onclick="copyToClipboard('refreshToken', this)">Copy</button>
                    </div>
                </div>
                ` : ''}

                <div class="info-box">
                    <p><strong>✅ Tokens đã được lưu vào localStorage</strong></p>
                    <p>📌 Bạn có thể sử dụng access_token để gọi API</p>
                    <p>🔧 Test API với Swagger UI hoặc Postman</p>
                    <p>📋 Authorization Header: <code>Bearer ${accessToken ? accessToken.substring(0, 20) + '...' : ''}</code></p>
                </div>
            `;
        }

        function copyToClipboard(elementId, button) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }

        function clearTokens() {
            if (confirm('Bạn có chắc muốn xóa tất cả tokens?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                alert('✓ Đã xóa tokens khỏi localStorage');
                window.location.href = '/';
            }
        }

        // Hiển thị tokens khi trang load
        displayTokens();

        // Log tokens to console for debugging
        console.log('=== OAuth2 Tokens ===');
        console.log('Access Token:', accessToken);
        console.log('Refresh Token:', refreshToken);
        console.log('Stored in localStorage:', {
            access_token: localStorage.getItem('access_token'),
            refresh_token: localStorage.getItem('refresh_token')
        });
    </script>
</body>
</html>
